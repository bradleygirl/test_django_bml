{% extends "blogs/base.html" %} {% block content %}

<h2>{{ post.title }}</h2>
<p class="text-right blog-owner">By {{ blog.owner.username }}</p>
<div class="text-right">
  <span>Posted to: <a href="{% url 'blogs:blog' blog.id %}">{{ blog.title }}</a></span> |
  <span>{{ post.date_added|date:"DATE_FORMAT" }}</span>
</div>

<div class="post-body">
  <p>{{ post.body|linebreaks }}</p>
</div>
{% endblock content %}
